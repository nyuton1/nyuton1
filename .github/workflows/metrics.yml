name: Metrics

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # lowlighter/metrics is unmaintained and v3.34 crashes when the GitHub
      # events API returns a PushEvent without "payload.commits"
      # (habits plugin: "Cannot destructure property 'author' of 'undefined'").
      # Patch the prebuilt image here; with "use_prebuilt_image: no" the action
      # reuses the local "metrics:3.34.0" image as-is instead of pulling/building.
      - name: Patch metrics image (fix habits plugin crash)
        run: |
          docker pull ghcr.io/lowlighter/metrics:v3.34
          docker create --name metrics-patch ghcr.io/lowlighter/metrics:v3.34
          docker cp metrics-patch:/metrics/source/plugins/habits/index.mjs habits.mjs
          grep -qF '.flatMap(({payload}) => payload.commits)' habits.mjs
          sed -i 's/\.flatMap(({payload}) => payload\.commits)/.flatMap(({payload}) => payload?.commits ?? [])/' habits.mjs
          docker cp habits.mjs metrics-patch:/metrics/source/plugins/habits/index.mjs
          docker commit metrics-patch metrics:3.34.0
          docker rm metrics-patch
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          user: nyuton1
          use_prebuilt_image: no
          # Don't publish a broken SVG: treat plugin errors (e.g. transient
          # GraphQL 401 in isocalendar) as fatal, retry the render, and keep
          # the previous image if every attempt fails.
          plugins_errors_fatal: yes
          retries: 3
          retries_delay: 300
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Asia/Tokyo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_sort: activity
          plugin_topics_limit: 15
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
          plugin_notable_types: commit, pull_request
